<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | cArthurDev</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{--bg:#09070f;--surface:#110d1d;--text:#f6f3fb;--muted:#a19aad;--purple:#a942ff;--bright:#c66aff;--pink:#ff63de;--mono:"DM Mono",monospace;--sans:"Manrope",sans-serif}
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}.space{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:120px 120px;pointer-events:none}.space:before,.space:after{content:"";position:absolute;border-radius:50%;filter:blur(75px);opacity:.2}.space:before{width:480px;height:480px;left:-160px;top:15%;background:var(--purple)}.space:after{width:380px;height:380px;right:-130px;bottom:-80px;background:#40117c}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--bright);box-shadow:0 0 12px 3px var(--purple)}.star:nth-child(1){left:18%;top:19%}.star:nth-child(2){right:16%;top:28%;width:2px;height:2px}.star:nth-child(3){left:73%;bottom:16%}.error-shell{width:min(720px,calc(100% - 44px));position:relative;text-align:center}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);font-size:14px;font-weight:800;letter-spacing:-.04em}.brand-mark{color:var(--bright);font:800 21px var(--mono)}.error-code{margin:54px 0 4px;color:var(--bright);font:500 clamp(88px,18vw,164px)/.8 var(--mono);letter-spacing:-.13em;text-shadow:0 0 34px rgba(198,106,255,.35)}h1{margin:0;font-size:clamp(23px,4vw,36px);letter-spacing:-.07em}p{max-width:380px;margin:17px auto 28px;color:var(--muted);font-size:13px;line-height:1.6}.terminal{display:inline-flex;align-items:center;gap:9px;margin-bottom:27px;padding:10px 13px;border:1px solid rgba(169,66,255,.45);border-radius:5px;background:rgba(35,20,54,.56);color:var(--muted);font:10px var(--mono)}.terminal b{color:var(--text);font-weight:400}.pulse{width:6px;height:6px;border-radius:50%;background:var(--bright);box-shadow:0 0 9px var(--bright)}.button{display:inline-flex;align-items:center;gap:22px;padding:14px 19px;border-radius:5px;background:linear-gradient(110deg,var(--purple),var(--bright));box-shadow:0 5px 25px rgba(169,66,255,.3);color:#fff;font:11px var(--mono);text-decoration:none;transition:transform .2s,box-shadow .2s}.button:hover{transform:translateY(-3px);box-shadow:0 8px 34px rgba(169,66,255,.5)}.button b{font-size:17px;font-weight:400}.horse{position:absolute;left:50%;top:12px;width:210px;height:45px;transform:translateX(-50%);opacity:.42;pointer-events:none}.horse:before{content:"";position:absolute;left:28px;top:18px;width:152px;height:16px;border:1px solid var(--bright);border-radius:50%;transform:rotate(-4deg);box-shadow:0 0 18px rgba(198,106,255,.3)}.horse:after{content:"";position:absolute;right:13px;top:2px;width:30px;height:25px;border:1px solid var(--pink);border-radius:60% 45% 45% 35%;transform:rotate(18deg)}.leg{position:absolute;top:29px;width:1px;height:15px;background:var(--bright)}.leg-a{left:58px;transform:rotate(12deg)}.leg-b{left:88px;transform:rotate(-8deg)}.leg-c{left:133px;transform:rotate(10deg)}.leg-d{left:158px;transform:rotate(-12deg)}.tail{position:absolute;left:20px;top:13px;width:28px;height:22px;border-left:1px solid var(--pink);border-radius:50%;transform:rotate(22deg)}
      @media(max-width:560px){.error-code{margin-top:42px}.horse{transform:translateX(-50%) scale(.8)}p{font-size:12px}.error-shell{width:min(100% - 32px,720px)}}
      @media(prefers-reduced-motion:reduce){.button{transition:none}}
    </style>
  <style>
      .language-switch{display:inline-flex;gap:2px;padding:3px;border:1px solid #655d70;border-radius:7px;margin-bottom:24px;position:relative;z-index:1}.language-switch button{min-width:36px;min-height:36px;border:0;border-radius:4px;background:transparent;color:var(--muted);font:11px var(--mono);cursor:pointer}.language-switch button[aria-pressed=true]{background:var(--surface);color:var(--text)}.language-switch button:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
    </style>
  </head>
  <body>
    <div class="space" aria-hidden="true"><i class="star"></i><i class="star"></i><i class="star"></i></div>
    <main class="error-shell">
      <div class="language-switch error-language" data-language-switch role="group" aria-label="Idioma / Language"><button type="button" data-language="pt" aria-label="Português" aria-pressed="true" lang="pt-BR">PT</button><button type="button" data-language="en" aria-label="English" aria-pressed="false" lang="en">EN</button></div>
      <a class="brand" href="/"><span class="brand-mark">&lt;/&gt;</span>cARTHURDEV <span>~</span></a>
      <div class="horse" aria-hidden="true"><i class="tail"></i><i class="leg leg-a"></i><i class="leg leg-b"></i><i class="leg leg-c"></i><i class="leg leg-d"></i></div>
      <div class="error-code">404</div>
      <div class="terminal"><span class="pulse"></span>arthur@dev:~$ <b>route not found</b></div>
      <h1>Esse caminho saiu do mapa.</h1>
      <p>A página que você procurou não existe, mudou de endereço ou está explorando outra dimensão.</p>
      <a class="button" href="/">voltar para o início <b>↗</b></a>
    </main>
  <script src="/i18n.js"></script>
  </body>
</html>
